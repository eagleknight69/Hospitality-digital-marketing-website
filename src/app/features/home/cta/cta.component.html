<!-- Final CTA with dramatic backdrop -->
<section id="contact" class="scroll-mt-20 md:scroll-mt-24 relative py-16 sm:py-20 md:py-28 lg:py-36 bg-black text-white overflow-hidden text-center">
  <div class="absolute inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1920&q=80"
         alt="Luxury villa overlooking seaside" referrerpolicy="no-referrer"
         class="w-full h-full object-cover opacity-30">
    <div class="absolute inset-0 bg-gradient-to-b from-luxury-charcoal/80 to-luxury-charcoal"></div>
  </div>

  <div class="relative z-10 max-w-4xl mx-auto px-6 flex flex-col items-center gap-6">
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-luxury-gold/20 border border-luxury-gold/30 text-luxury-gold text-[10px] sm:text-xs uppercase tracking-widest font-mono">
      Recapture Your Profit Margins
    </div>
    <h2 class="text-3xl min-[400px]:text-4xl sm:text-5xl md:text-6xl font-serif font-light leading-tight">
      Let's Grow Your <span class="italic font-normal text-luxury-gold">Hotel Together</span>
    </h2>
    <p class="text-sm sm:text-base md:text-lg text-white font-normal leading-relaxed max-w-2xl">
      Stop giving away 20% commission rates to OTAs. Schedule a free 30-minute hospitality direct booking strategy session and let our experts map your path to independence.
    </p>

    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 mt-4 md:mt-6 w-full sm:w-auto">
      <button (click)="openBooking('schedule')" id="final-cta-book-btn" type="button"
              class="px-6 py-3.5 sm:px-8 sm:py-4 rounded-full bg-luxury-gold text-luxury-charcoal hover:bg-white hover:text-luxury-charcoal transition-all text-xs uppercase tracking-widest font-bold flex items-center justify-center gap-2 cursor-pointer shadow-lg border-0">
        <mat-icon class="text-base">calendar_today</mat-icon>
        Book Free Consultation
      </button>
      <button (click)="openBooking('audit')" id="final-cta-audit-btn" type="button"
              class="px-6 py-3.5 sm:px-8 sm:py-4 rounded-full border border-white/30 hover:bg-white/10 transition-all text-xs uppercase tracking-widest font-semibold flex items-center justify-center gap-2 cursor-pointer bg-transparent text-white">
        <mat-icon class="text-base">auto_awesome</mat-icon>
        Instant AI Growth Audit
      </button>
    </div>
  </div>
</section>
