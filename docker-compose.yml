services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospitality-marketing-web
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"
    restart: unless-stopped
